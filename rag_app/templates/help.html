<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Справка — RAG Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◧</span>
      <div>
        <h1>Справка</h1>
        <p class="muted">{{ title }}</p>
      </div>
    </div>
    <div style="display:flex;gap:12px">
      <a href="/" class="btn">← К дашборду</a>
      <a href="/recommendations" class="btn">Рекомендации</a>
    </div>
  </header>

  <main class="main" style="max-width:980px;margin:0 auto;padding:20px 24px">
    <article class="md">
      {{ content|safe }}
    </article>
  </main>

  <script src="{{ url_for('static', filename='tooltip.js') }}"></script>
</body>
</html>
